# ============================================================
# Training Configuration
# All pipeline settings in one place.
# Edit this file to change any training parameter.
# ============================================================

data:
  path: "fraud_oracle.csv"
  target: "FraudFound_P"
  cols_to_drop: ["PolicyNumber"]
  random_state: 42
  test_size: 0.20        # 80/20 first split
  val_size: 0.50         # 50/50 of the 20% → gives 80/10/10

features:
  chunk_size: 500
  chunk_overlap: 100

triage:
  pct_siu: 0.05          # top 5% → SIU
  pct_manual: 0.15       # next 15% → Manual Review

shap:
  n_reason_codes: 5

business:
  avg_fraud_loss: 15000
  siu_cost: 500
  manual_cost: 100

optuna:
  n_trials: 20
  cv_folds: 3
  timeout: 300           # seconds per study

xgboost_base:
  n_estimators: 2000
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50

mlflow:
  experiment_name: "fraud-triage"
  tracking_uri: "mlruns"  # local folder; change to remote URI if needed

logging:
  level: "INFO"
