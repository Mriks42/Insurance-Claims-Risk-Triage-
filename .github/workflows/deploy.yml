# ============================================================
# GitHub Actions — Auto-deploy to Hugging Face Spaces
# ============================================================
# Triggers on every push to main branch.
# Syncs the repo to your Hugging Face Space automatically.
#
# Setup (one time):
#   1. Go to huggingface.co → Settings → Access Tokens
#   2. Create a token with "write" permission
#   3. Go to your GitHub repo → Settings → Secrets → Actions
#   4. Add secret: HF_TOKEN = your_token_value
#   5. Add secret: HF_USERNAME = your_huggingface_username
#   6. Add secret: HF_SPACE_NAME = fraud-triage  (or whatever you name it)
# ============================================================

name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:    # allows manual trigger from GitHub UI

jobs:
  # Gate: the deploy job below will not start unless this passes.
  # Without it, tests.yml and this workflow would run independently and a
  # red test suite would still ship to the Space.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        # Mirrors tests.yml exactly — keep the two invocations identical so the
        # gate can never disagree with the badge.
        run: pytest tests/ --tb=short -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # Replace README.md with the HF version (which has the required front matter)
          cp README_HF.md README.md

          python - <<'EOF'
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = f"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE_NAME']}"

          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              # NOTE: upload_folder only adds/updates — it never deletes files
              # already in the Space. Anything ignored here must be put in the
              # Space by hand once, or a freshly created Space will crash on
              # startup. fraud_oracle.csv is the one file in that category: it
              # is gitignored (Kaggle TOS), so CI cannot ship it. Upload it via
              # the Space's Files tab after creating the Space.
              # best_model_improved.joblib is ~1 MB and IS committed, so it is
              # deliberately NOT ignored — the app cannot start without it.
              ignore_patterns=[
                  ".git*",
                  "__pycache__",
                  "*.pyc",
                  ".env",
                  "fraud_oracle.csv",   # gitignored; upload to the Space manually once
                  "outputs/models/*",   # superseded by outputs/improvement/
                  "mlruns/",
                  "tests/",
              ],
              commit_message=f"Auto-deploy from GitHub Actions",
          )
          print(f"Deployed to: https://huggingface.co/spaces/{repo_id}")
          EOF
